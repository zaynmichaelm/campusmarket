<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            padding:20px;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,
        td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        th{
            background:#007bff;
            color:white;
        }

    </style>
</head>
<body>

    <h1>Printing Requests Dashboard</h1>

    <table>

        <thead>

            <tr>
                <td>${request.studentName}</td>
                <td>${request.gradeSection}</td>
                <td>${request.printType}</td>
                <td>${request.copies}</td>
                <td>${request.notes}</td>
            </tr>

        </thead>

        <tbody id="requestTable">

        </tbody>

    </table>

    <script>

        const requests =
            JSON.parse(localStorage.getItem("printRequests")) || [];

        const table =
            document.getElementById("requestTable");

        requests.forEach(request => {

            table.innerHTML += `
                <tr>
                    <td>${request.studentName}</td>
                    <td>${request.gradeSection}</td>
                    <td>${request.printType}</td>
                    <td>${request.paperSize}</td>
                    <td>${request.copies}</td>
                    <td>${request.notes}</td>
                    <td>${request.date}</td>
                </tr>
            `;

        });

    </script>

</body>
</html>
`
