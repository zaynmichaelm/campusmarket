<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Market - Printing Services</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="printing-container">

        <h1>🖨 Printing & Document Services</h1>

        <p>
            Upload your document or provide a document link for printing.
        </p>

        <form>

    <label>Student Name</label>
    <input type="text" id="studentName"
        placeholder="Enter your name">

    <label>Grade & Section</label>
    <input type="text" id="gradeSection"
        placeholder="e.g. 12 STEM - Einstein">

    <label>Upload Document</label>
    <input type="file" id="documentFile">

    <label>Document URL</label>
    <input type="url" id="documentUrl"
        placeholder="Paste Google Drive, OneDrive or Canva link">

    <label>Print Type</label>

<select id="printType">

    <option value="" selected disabled>
        Select Print Type
    </option>

    <option>Not Colored Bondpaper A4 (Text) - ₱5</option>

    <option>Colored Bondpaper A4 - ₱15</option>

    <option>WORX A4 - ₱30</option>

    <option>Photo paper (Glossy) A4 - ₱30</option>

</select>

    <label>Number of Copies</label>
    <input type="number" id="copies"
        min="1" value="1">

    <label>Additional Notes</label>
    <textarea id="notes"
        placeholder="Example: Please staple all pages.  How many copies per page."></textarea>

    <button type="button"
        onclick="submitRequest()">
        Submit Print Request
    </button>

    <p id="success-message"></p>

</form>

    </div>

<script src="printing.js"></script>

</body>
</html>
